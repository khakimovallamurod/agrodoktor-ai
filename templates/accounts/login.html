{% extends "base.html" %}

{% block title %}Demoga kirish | AgroDoktor{% endblock %}

{% block content %}
<div class="min-h-screen w-full bg-slate-50 flex items-center justify-center px-4 py-12 safe-top">
  <div class="w-full max-w-md">

    <form method="post" action="{% url 'demo_login' %}"
          class="bg-white rounded-3xl border border-slate-200 shadow-xl shadow-slate-200/60 p-6 sm:p-8"
          x-data="{ show: false }">
      {% csrf_token %}

      <!-- Logo va sarlavha -->
      <a href="{% url 'landing' %}" class="flex flex-col items-center text-center group" aria-label="AgroDoktor bosh sahifa">
        <div class="w-14 h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-lg shadow-emerald-600/25 transition-transform group-hover:scale-105">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <span class="mt-3 text-2xl font-black text-slate-900 tracking-tight">AgroDoktor</span>
        <span class="mt-0.5 text-sm font-semibold text-emerald-700">Agrotexnik AI xizmati</span>
      </a>

      <div class="mt-6 pt-6 border-t border-slate-200">
        <h1 class="text-xl font-bold text-slate-900">Demoga kirish</h1>
        <p class="mt-1 text-base text-slate-500">Sizga berilgan login va parolni kiriting.</p>
      </div>

      {% if error %}
        <div class="mt-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-semibold" role="alert">{{ error }}</div>
      {% endif %}

      <div class="mt-6">
        <label for="id_username" class="block text-sm font-bold text-slate-800 mb-1.5">Login</label>
        <input id="id_username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required
               value="{{ username|default:'' }}" {% if not username %}autofocus{% endif %}
               class="w-full min-h-[52px] px-4 rounded-xl border border-slate-300 bg-white text-base text-slate-900 focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/15 transition">
      </div>

      <div class="mt-4">
        <label for="id_password" class="block text-sm font-bold text-slate-800 mb-1.5">Parol</label>
        <div class="relative">
          <input id="id_password" name="password" type="password" :type="show ? 'text' : 'password'" autocomplete="current-password" required
                 {% if username %}autofocus{% endif %}
                 class="w-full min-h-[52px] pl-4 pr-14 rounded-xl border border-slate-300 bg-white text-base text-slate-900 focus:outline-none focus:border-emerald-600 focus:ring-4 focus:ring-emerald-600/15 transition">
          <button type="button" @click="show = !show"
                  :aria-pressed="show.toString()"
                  :aria-label="show ? 'Parolni yashirish' : 'Parolni ko\'rsatish'"
                  aria-label="Parolni ko'rsatish"
                  class="absolute right-1.5 top-1.5 bottom-1.5 w-11 flex items-center justify-center rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors">
            <!-- Ko'z: parol yashirin -->
            <svg x-show="!show" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Yopiq ko'z: parol ko'rinib turibdi -->
            <svg x-show="show" style="display:none" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c4.36 0 8.1 2.63 9.94 6.65a1 1 0 0 1 0 .7 10.6 10.6 0 0 1-1.56 2.55"/>
              <path d="M6.61 6.61A13.53 13.53 0 0 0 2.06 11.65a1 1 0 0 0 0 .7A10.75 10.75 0 0 0 12 19a10.4 10.4 0 0 0 5.39-1.61"/>
              <path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/>
              <path d="m2 2 20 20"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit"
              class="mt-6 w-full inline-flex items-center justify-center gap-2 min-h-[52px] rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-base shadow-sm transition active:scale-[0.98]">
        Kirish
      </button>
    </form>

    <p class="mt-6 text-center">
      <a href="{% url 'landing' %}" class="text-sm font-semibold text-slate-500 hover:text-emerald-700">Bosh sahifaga qaytish</a>
    </p>
  </div>
</div>
{% endblock %}
