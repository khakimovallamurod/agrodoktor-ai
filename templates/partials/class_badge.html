{% if clz == "healthy" %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
  <span class="w-2 h-2 rounded-full bg-emerald-600"></span>
  Sog'lom
</span>
{% elif clz == "suspicious" %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold bg-amber-50 text-amber-700 border border-amber-200">
  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
  Kuzatuv talab etadi
</span>
{% elif clz == "diseased" %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold bg-rose-50 text-rose-700 border border-rose-200">
  <span class="w-2 h-2 rounded-full bg-rose-600"></span>
  Kasallik aniqlandi
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-semibold bg-slate-100 text-slate-700 border border-slate-200">
  <span class="w-2 h-2 rounded-full bg-slate-400"></span>
  Noma'lum
</span>
{% endif %}
