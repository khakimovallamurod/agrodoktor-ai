{% load static %}
<aside class="hidden lg:flex lg:flex-col lg:w-72 lg:fixed lg:inset-y-0 lg:z-30 bg-white border-r border-slate-200"
       aria-label="Asosiy navigatsiya">

  <!-- Logo Header (Modern AgroDoktor Sprout Leaf) -->
  <div class="h-20 flex items-center gap-3.5 px-6 border-b border-slate-200">
    <div class="w-11 h-11 rounded-2xl bg-emerald-600 flex items-center justify-center text-white flex-shrink-0 shadow-sm">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
      </svg>
    </div>
    <div>
      <span class="text-xl font-black text-slate-900 tracking-tight block">AgroDoktor</span>
      <span class="text-sm font-semibold text-emerald-700 block">Agrotexnik AI xizmati</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <div class="flex-1 px-4 py-6 space-y-6 overflow-y-auto">
    
    <div>
      <p class="px-4 text-sm font-bold uppercase tracking-wider text-slate-400 mb-2.5">
        Asosiy bo'limlar
      </p>

      <nav class="space-y-1.5" aria-label="Asosiy menyu">

        <!-- 1. Bosh sahifa -->
        <a href="{% url 'dashboard' %}"
           class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-base font-bold transition-all
             {% if request.resolver_match.url_name == 'dashboard' %}bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-xs{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
          <svg class="w-5 h-5 flex-shrink-0 {% if request.resolver_match.url_name == 'dashboard' %}text-emerald-600{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <span>Bosh sahifa</span>
        </a>

        <!-- 2. Yangi tekshiruv -->
        <a href="{% url 'new_scan' %}"
           class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-base font-bold transition-all
             {% if request.resolver_match.url_name == 'new_scan' %}bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-xs{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
          <svg class="w-5 h-5 flex-shrink-0 {% if request.resolver_match.url_name == 'new_scan' %}text-emerald-600{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          <span>Yangi tekshiruv</span>
        </a>

        <!-- 3. Tahlil tarixi -->
        <a href="{% url 'scan_history' %}"
           class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-base font-bold transition-all
             {% if request.resolver_match.url_name == 'scan_history' %}bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-xs{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
          <svg class="w-5 h-5 flex-shrink-0 {% if request.resolver_match.url_name == 'scan_history' %}text-emerald-600{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          <span>Tahlil tarixi</span>
        </a>

        <!-- 4. Statistika -->
        <a href="{% url 'statistics' %}"
           class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-base font-bold transition-all
             {% if request.resolver_match.url_name == 'statistics' %}bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-xs{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
          <svg class="w-5 h-5 flex-shrink-0 {% if request.resolver_match.url_name == 'statistics' %}text-emerald-600{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          <span>Statistika</span>
        </a>

        <!-- 5. Profil -->
        <a href="{% url 'profile' %}"
           class="flex items-center gap-3.5 px-4 py-3 rounded-2xl text-base font-bold transition-all
             {% if request.resolver_match.url_name == 'profile' %}bg-emerald-50 text-emerald-800 border border-emerald-200 shadow-xs{% else %}text-slate-600 hover:bg-slate-100 hover:text-slate-900{% endif %}">
          <svg class="w-5 h-5 flex-shrink-0 {% if request.resolver_match.url_name == 'profile' %}text-emerald-600{% else %}text-slate-400{% endif %}" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Profil</span>
        </a>

      </nav>
    </div>

  </div>

  <!-- User Card & Logout Bottom -->
  <div class="p-4 border-t border-slate-200">
    <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-200">
      <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-black text-sm flex-shrink-0 shadow-sm">
        {{ user.first_name|first|upper }}{{ user.last_name|first|upper }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold text-slate-900 truncate">{{ user.get_full_name|default:user.username }}</p>
        <p class="text-sm font-semibold text-slate-500 truncate">Fermer hisobi</p>
      </div>
    </div>
    <form method="post" action="{% url 'logout' %}" class="mt-3">
      {% csrf_token %}
      <button type="submit"
              class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold text-rose-600 hover:bg-rose-50 transition-colors"
              aria-label="Tizimdan chiqish">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span>Chiqish</span>
      </button>
    </form>
  </div>

</aside>
